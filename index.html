<!DOCTYPE html>
<html>
<head>
    <title>Churn Prediction</title>
</head>
<body>
    <h2>Customer Churn Prediction</h2>
    <form action="/predict" method="POST">
        <label>Geography (France, Germany, Spain):</label><br>
        <input type="text" name="geography" value="{{ geography }}" required><br><br>

        <label>Gender (Female, Male):</label><br>
        <input type="text" name="gender" value="{{ gender }}" required><br><br>

        <label>Credit Score:</label><br>
        <input type="number" step="any" name="credit_score" value="{{ credit_score }}" required><br><br>

        <label>Age:</label><br>
        <input type="number" step="any" name="age" value="{{ age }}" required><br><br>

        <label>Tenure:</label><br>
        <input type="number" name="tenure" value="{{ tenure }}" required><br><br>

        <label>Balance:</label><br>
        <input type="number" step="any" name="balance" value="{{ balance }}" required><br><br>

        <label>Number of Products:</label><br>
        <input type="number" name="num_of_products" value="{{ num_of_products }}" required><br><br>

        <label>Has Credit Card (Yes or No):</label><br>
        <input type="text" name="has_cr_card" value="{{ has_cr_card }}" required><br><br>

        <label>Is Active Member (Yes or No):</label><br>
        <input type="text" name="is_active_member" value="{{ is_active_member }}" required><br><br>

        <label>Estimated Salary:</label><br>
        <input type="number" step="any" name="estimated_salary" value="{{ estimated_salary }}" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
